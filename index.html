<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <center>
      <h1>Attendence Data</h1>
      <div class="container-md">
        <label class="searchBar" style="opacity: 0">Enter Your Name</label>
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            placeholder="Recipient's username"
            aria-label="Recipient's username with two button addons"
          />
          <button class="btn btn-outline-secondary search" type="button">
            SEARCH
          </button>
          <button class="btn btn-outline-secondary add" type="button">
            ADD
          </button>
        </div>
        <div class="table-1-container m-2" style="opacity: 0">
          <table class="table table-1">
            <thead>
              <tr>
                <th scope="col">S:No</th>
                <th scope="col">Name</th>
                <th scope="col">Batch</th>
                <th scope="col">Present</th>
                <th scope="col">Absent</th>
                <!-- <th scope="col">Joined Date</th> -->
                <th scope="col">Attended</th>
              </tr>
            </thead>
            <tbody id="root"></tbody>
          </table>
          <button class="btn btn-outline-success takeBtn">
            Take Attendence
          </button>
        </div>
      </div>
      <div
        class="border border-success rounded-5x m-4 form-data"
        style="opacity: 0"
      >
        <label>Name</label
        ><input
          id="inputName"
          class="form-control form-control-1 m-1 p-1 w-25"
          type="text"
          placeholder="Enter name"
          aria-label="readonly input example"
        />
        <label>Batch</label>
        <input
          id="inputBatch"
          class="form-control form-control-2 m-1 p-1 w-25"
          type="text"
          placeholder="Enter Batch"
          aria-label="readonly input example"
        />
        <button type="button" class="btn btn-success submit btn-success">
          Submit
        </button>
      </div>
    </center>
  </body>
  <script src="script.js"></script>
</html>
